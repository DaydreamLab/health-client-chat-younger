name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit
        run: pnpm test

      - name: Generate static site
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /
          # Mock／placeholder only — do not call a real model or prod API in CI.
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:8080/api/v1
          NUXT_PUBLIC_FE_SHA: ${{ github.sha }}
          NUXT_PUBLIC_APP_VERSION: ci

      - name: Check static pages for every route
        run: pnpm check:static-pages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: SPA static e2e (mock API, CloudFront-like server)
        run: pnpm test:e2e:spa
